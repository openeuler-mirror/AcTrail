[capture]
profile_name = "access-control-xiaoo-regression"
capabilities = ["proc-lifecycle", "net-transport", "socket-plaintext-payload", "enforcement-file-permission-lsm", "enforcement-file-mkdir-seccomp", "enforcement-command-execution-seccomp", "enforcement-network-connect-lsm"]
opportunistic_capabilities = []

[seccomp_notify]
enabled = true

[access_control.file.open]
enabled = true
backend = "lsm"

[access_control.file.mkdir]
enabled = true
backend = "seccomp"

[access_control.file.rmdir]
enabled = true
backend = "lsm"

[access_control.command.exec]
enabled = true
backend = "seccomp"

[access_control.network.connect]
enabled = true
backend = "lsm"
