[control]
socket_path = "/tmp/actrail-e2e/tls-only/control.sock"
socket_mode_octal = "660"
pid_file = "/tmp/actrail-e2e/tls-only/actraild.pid"
log_path = "/tmp/actrail-e2e/tls-only/actraild.log"
diagnostic_log_level = "info"

[storage.sqlite]
path = "/tmp/actrail-e2e/tls-only/actrail.sqlite"

[semantic_retention]
content_owner = "configured_layers"

[semantic_retention.l4_payload]
enabled = true
stats = true
body_content = "retained"

[export.snapshot]
directory = "/tmp/actrail-e2e/tls-only/export"

[plugins.startup]
enabled = false

[payload.tls]
sync_event_socket_path = "/tmp/actrail-e2e/tls-only/tls-sync.sock"
enabled = true
capture_backend = "tls-sync"

[capture]
profile_name = "guest-tls-only"
capabilities = ["tls-plaintext-payload"]
opportunistic_capabilities = []

[enforcement]
enabled = false

[ebpf]
enabled = false

[payload.socket]
enabled = false

[payload.stdio]
enabled = false
