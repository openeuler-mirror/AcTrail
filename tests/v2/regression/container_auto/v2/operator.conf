[plugins.startup]
enabled = true
failure_policy = "fail-fast"

[[plugins.startup.load]]
instance = "container-auto.otel-jsonl"
enabled = true
manifest = "@RUNTIME_DIR@/etc/actrail/plugins/otel-jsonl/otel-jsonl.plugin.toml"
plugin_config = "@RUNTIME_DIR@/etc/actrail/plugins/otel-jsonl/otel-jsonl.config.toml"
host_grants = []

[control]
socket_path = "@RUNTIME_DIR@/run/control.sock"
pid_file = "@RUNTIME_DIR@/run/actraild.pid"
log_path = "@RUNTIME_DIR@/log/actraild.log"

[storage]
backend = "sqlite"

[storage.sqlite]
path = "@RUNTIME_DIR@/data/actrail.sqlite"

[export.snapshot]
directory = "@RUNTIME_DIR@/data/export"

[capture]
profile_name = "container-auto"
capabilities = [
    "proc-lifecycle",
    "net-transport",
    "tls-plaintext-payload",
    "proc-exec-context",
]
opportunistic_capabilities = [
    "fs-access-basic",
    "fs-mmap",
    "ipc-unix-socket",
    "ipc-pipe-fifo",
    "stdio-chunk",
    "socket-plaintext-payload",
    "net-application-plaintext-http",
    "net-application-http2-frames",
    "resource-metrics",
]

[ebpf]
enabled = @EBPF_ENABLED@
event_ring_buffer_max_bytes = 8388608

[payload.tls]
redaction_policy = "authorization-header"
sync_event_socket_path = "@RUNTIME_DIR@/run/tls-sync.sock"

[payload.socket]
enabled = false
