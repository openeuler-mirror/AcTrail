[general]
id = "wasm.network-reusable-deny"
api_version = "actrail.plugin.v2"
role = "control-decider"
runtime = "wasm"

[host]
capabilities = ["network-action.current-context-query"]

[runtime.wasm]
artifact_path = "context-reusable-deny.wasm"
abi = "wit-component"

[runtime.wasm.resources]
fuel_per_call = 1000000
memory_max_bytes = 2097152

[role.control-decider.resources]
concurrency_limit = 1

[hostcall_limits.network_policy]
context_ref_max_bytes = 128
query_max_bytes = 128
read_max_bytes = 1024

[plugin_config]
format = "toml"
required = false
