instance_lock_path = "/run/actrail/actrail-sb.lock"

[collector]
root_process_names = ["xiaoo", "claude"]
procfs_root = "/proc"
require_initial_root = false
root_refresh_interval_ms = 1000
tracked_process_capacity = 16384
pending_io_capacity = 32768
aggregate_capacity = 4096
oom_event_capacity = 256
poll_interval_ms = 1000

[sampler]
poll_interval_ms = 1000

[observation_queue]
capacity = 1024

[sender]
batch_max_observations = 256
io_timeout_ms = 1000
max_silence_interval_ms = 5000
reconnect_interval_ms = 1000
worker_thread_stack_bytes = 524288

[control]
socket_path = "/run/actrail/actrail-sb-control.sock"
socket_mode_octal = "600"
request_timeout_ms = 5000
accepted_connection_max = 8
max_frame_bytes = 1024
worker_thread_stack_bytes = 262144

[diagnostics]
interval_ms = 0
