# AcTrail guest daemon config — Kata sandbox 内的 actraild(模板)。
#
# 稀疏配置:未写字段继承 OperatorDocument 缺省。两条实测踩过的坑已固化:
#   1) 语义投影不会自动开 — [application] 与 [semantic_retention.*] 必须显式启用;
#   2) [capture] capabilities 必须含 net-application-plaintext-http,
#      否则应用层分析器不绑定,TLS payload 采到了也不出 span。
#
# workload 的 control-plane 授权由 daemon 从内核对端凭据解析 PID namespace 和
# mount namespace；containerd ID 只属于 runtime 生命周期，不参与授权。
# 身份三键:
#   host.id      — 可选的 guest Linux host 身份;microVM 无 DMI 时允许缺失,
#                  不得用 sandbox/container id 重载其语义。
#   k8s.pod.uid  — 同 cgroup 解析提取(kata guest 已支持 0::/<ns>/<id> 基础布局)。
#   container.id — guest 内 cgroup 解析;host.id 缺失时也作为 trace ID 生成锚点。

[control]
socket_path = "/dev/actrail/control.sock"
socket_mode_octal = "660"
pid_file = "/run/actrail/private/actraild.pid"
log_path = "/run/actrail/private/actraild.log"
# 可选:仅在部署方有语义正确且稳定的 guest host ID 时显式配置。
# host_id = "<guest-host-id>"

[storage.sqlite]
path = "/run/actrail/private/actrail.sqlite"

[export.snapshot]
directory = "/run/actrail/private/export"

[plugins.startup]
enabled = true
failure_policy = "fail-fast"

# 实时出境是虚拟容器形态的主路径:guest 随 sandbox 销毁,本地文件不可靠。
[[plugins.startup.load]]
instance = "kata-guest.otel-http"
enabled = true
manifest = "/usr/share/actrail/plugins/otel-http/otel-http.plugin.toml"
plugin_config = "/etc/actrail/plugins/otel-http/otel-http.config.toml"
host_grants = []

[capture]
profile_name = "kata-guest"
# TLS 基座 + 应用层分析(L2 span 的前提);eBPF 类能力走 opportunistic,
# guest 内核开不了 BPF 时两轴 auto 降级、显式标 degraded,而不是拒绝启动。
capabilities = [
    "tls-plaintext-payload",
    "net-application-plaintext-http",
]
opportunistic_capabilities = [
    "proc-lifecycle",
    "net-transport",
    "fs-access-basic",
    "stdio-chunk",
    "net-application-http2-frames",
    "resource-metrics",
]

[ebpf]
# guest 内核有 BTF/BPF 则启用,没有则降级 TLS-only。
enabled = "auto"

[payload.tls]
enabled = true
capture_backend = "tls-sync"
sync_runtime_library_path = "/usr/local/lib/actrail/libactrail_tls_payload_probe_sync.so"
sync_event_socket_path = "/dev/actrail/tls-sync.sock"
sync_socket_mode_octal = "660"
redaction_policy = "authorization-header"

[payload.socket]
# 默认 backend 含 seccomp fallback；当前 Kata Profile 整体关闭该采集轴。
enabled = false

[seccomp_notify]
# 当前 Kata Profile 未通过 AcTrail seccomp user-notify 生命周期验收。
enabled = false

[process_seccomp]
enabled = false

[enforcement]
# 当前 Kata Profile 只做旁路观测，不启用 fanotify/seccomp enforcement。
enabled = false

[application]
enabled = true
http1_enabled = true
http2_enabled = true

[semantic_retention.l0_llm_call]
enabled = true

[semantic_retention.l2_http]
enabled = true
message_summary = true
headers = "metadata"
body_content = "text"
