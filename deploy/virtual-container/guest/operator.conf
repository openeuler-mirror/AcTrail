# Guest observation settings applied to the default daemon configuration.

[control]
socket_path = "/dev/actrail/control.sock"
socket_mode_octal = "660"
pid_file = "/run/actrail/private/actraild.pid"
log_path = "/run/actrail/private/actraild.log"
# 可选:仅在部署方有语义正确且稳定的 guest host ID 时显式配置。
# host_id = "<guest-host-id>"

[storage.sqlite]
path = "/run/actrail/private/actrail.sqlite"

[export.snapshot]
directory = "/run/actrail/private/export"

# 默认仅写 Guest 本地 SQLite，便于离线调试和通过 actrailviewer 查看。
# install-rootfs.sh 只在显式传入 --otel-endpoint 时追加完整的插件启动段。

[capture]
profile_name = "kata-guest"
# Guest 观察能力。文件治理由部署策略单独配置。
capabilities = [
    "tls-plaintext-payload",
    "socket-plaintext-payload",
    "net-application-plaintext-http",
]
opportunistic_capabilities = [
    "proc-lifecycle",
    "net-transport",
    "fs-access-basic",
    "stdio-chunk",
    "net-application-http2-frames",
    "resource-metrics",
]

[payload.tls]
sync_runtime_library_path = "/usr/local/lib/actrail/libactrail_tls_payload_probe_sync.so"
sync_event_socket_path = "/dev/actrail/tls-sync.sock"
sync_socket_mode_octal = "660"
redaction_policy = "authorization-header"

[enforcement]
# Guest 服务负责旁路观测。
enabled = false

[application]
enabled = true
http1_enabled = true
http2_enabled = true

[semantic_retention.l0_llm_call]
enabled = true

[semantic_retention.l2_http]
enabled = true
message_summary = true
headers = "metadata"
body_content = "text"

[semantic_retention.l4_payload]
enabled = true
stats = true
body_content = "retained"
