services:
  otelcol-contrib:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    memswap_limit: 384m
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      OTELCOL_OTLP_HTTP_ENDPOINT: "${OTELCOL_OTLP_HTTP_ENDPOINT:?set OTELCOL_OTLP_HTTP_ENDPOINT in .env}"
      GOMEMLIMIT: 320MiB
    logging:
      driver: json-file
      options:
        max-size: "16m"
        max-file: "3"
    volumes:
      - type: bind
        source: ./otelcol-contrib.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
        bind:
          create_host_path: false
          selinux: z
      - type: bind
        source: "${OTELCOL_DATA_DIR:?set OTELCOL_DATA_DIR in .env}"
        target: /var/lib/otelcol
        read_only: false
        bind:
          create_host_path: false
          selinux: Z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
