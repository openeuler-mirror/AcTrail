<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">AcTrail execution-isolation deployment across Hand and Brain Hosts</title>
  <desc id="desc">The Hand Agent is observed through Guest kernel sources by actrail-sb and a VSOCK gateway. The Brain Host separately observes its local Agent and routes Hand observations to sandbox plugins or dedicated evidence and alert databases.</desc>
  <defs>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ea580c"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#dc2626"/></marker>
    <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0891b2"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0f766e"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
    <style>
      .host{font:700 23px system-ui,-apple-system,"Segoe UI",sans-serif}.section{font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif}.node{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033;text-anchor:middle}.sub{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;text-anchor:middle}.edge{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}.badge{font:700 11px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}.note{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="840" fill="#fff"/>
  <rect x="20" y="20" width="550" height="800" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
  <text x="48" y="58" class="host" fill="#9a3412">HAND HOST</text>
  <rect x="55" y="88" width="480" height="390" rx="18" fill="#fffbeb" stroke="#fed7aa" stroke-width="2"/>
  <text x="78" y="120" class="section" fill="#9a3412">SANDBOX GUEST</text>
  <rect x="280" y="101" width="230" height="27" rx="13" fill="#ffedd5"/>
  <text x="395" y="119" class="badge" fill="#9a3412">Firecracker · StratoVirt · Cloud Hypervisor</text>

  <rect x="80" y="180" width="160" height="82" rx="15" fill="#fff" stroke="#fb923c" stroke-width="2"/>
  <text x="160" y="226" class="node">Agent Hand</text>
  <rect x="315" y="165" width="190" height="112" rx="15" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="410" y="207" class="node">Guest kernel sources</text><text x="410" y="233" class="sub">eBPF · procfs · OOM</text>
  <path d="M240 221 H315" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#orange)"/>
  <text x="277" y="205" class="edge" fill="#475569">activity</text>

  <rect x="315" y="345" width="190" height="92" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="410" y="383" class="node">actrail-sb</text><text x="410" y="409" class="sub">Guest observer</text>
  <path d="M375 345 V277" fill="none" stroke="#7c3aed" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#purple)"/>
  <text x="345" y="315" class="edge" fill="#6d28d9">attach / sample</text>
  <path d="M445 277 V345" fill="none" stroke="#ea580c" stroke-width="2.8" marker-end="url(#orange)"/>
  <text x="480" y="305" class="edge" fill="#c2410c">I/O · resource</text><text x="480" y="322" class="edge" fill="#c2410c">· OOM</text>

  <rect x="145" y="545" width="300" height="92" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/>
  <text x="295" y="583" class="node">actrail-vsock-gateway</text><text x="295" y="609" class="sub">session + frame forwarding only</text>
  <path d="M410 437 V500 Q410 515 395 515 H310 Q295 515 295 530 V545" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#orange)"/>
  <text x="410" y="501" class="edge" fill="#c2410c">AF_VSOCK / VMM bridge</text>
  <rect x="55" y="770" width="480" height="28" rx="14" fill="#fff1f2"/>
  <text x="295" y="789" class="note" fill="#be123c">Disconnected Hand observations are not buffered or replayed</text>

  <rect x="630" y="20" width="550" height="800" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="2.5"/>
  <text x="658" y="58" class="host" fill="#155e75">BRAIN HOST</text>
  <rect x="670" y="135" width="160" height="142" rx="15" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="750" y="181" class="node">Agent Brain</text>
  <rect x="685" y="222" width="130" height="34" rx="12" fill="#ede9fe"/>
  <text x="750" y="244" class="sub">TLS-sync runtime</text>
  <rect x="930" y="135" width="205" height="112" rx="15" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="1032" y="177" class="node">Host kernel sources</text><text x="1032" y="203" class="sub">eBPF · seccomp · fanotify</text>
  <path d="M830 191 H930" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#cyan)"/>
  <text x="880" y="175" class="edge" fill="#475569">activity</text>

  <rect x="850" y="345" width="280" height="104" rx="16" fill="#cffafe" stroke="#06b6d4" stroke-width="3"/>
  <text x="990" y="385" class="node">actraild</text><text x="990" y="411" class="sub">local ingest + Hand gateway ingest</text>
  <path d="M1032 247 V345" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#cyan)"/>
  <text x="1080" y="306" class="edge" fill="#0e7490">kernel events</text>
  <path d="M815 239 H855 Q870 239 870 254 V320 Q870 335 885 335 H900 V345" fill="none" stroke="#7c3aed" stroke-width="2.7" marker-end="url(#purple)"/>
  <text x="850" y="227" class="edge" fill="#6d28d9">TLS plaintext</text>

  <path d="M670 548 C670 540.8 712.5 535 765 535 S860 540.8 860 548 V608 C860 615.2 817.5 621 765 621 S670 615.2 670 608 Z" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <path d="M670 548 C670 555.2 712.5 561 765 561 S860 555.2 860 548" fill="none" stroke="#14b8a6" stroke-width="2"/>
  <text x="765" y="571" class="node">Brain Trace Store</text><text x="765" y="596" class="sub">brain-side traces + actions</text>
  <rect x="940" y="535" width="190" height="86" rx="15" fill="#fff" stroke="#14b8a6" stroke-width="2"/>
  <text x="1035" y="571" class="node">Sandbox plugins</text><text x="1035" y="596" class="sub">matching observations</text>
  <path d="M850 415 H780 Q765 415 765 430 V535" fill="none" stroke="#0f766e" stroke-width="2.7" marker-end="url(#teal)"/>
  <path d="M1035 449 V535" fill="none" stroke="#0f766e" stroke-width="2.7" marker-end="url(#teal)"/>
  <text x="1080" y="498" class="edge" fill="#0f766e">matched</text>

  <path d="M670 703 C670 695.8 712.5 690 765 690 S860 695.8 860 703 V763 C860 770.2 817.5 776 765 776 S670 770.2 670 763 Z" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <path d="M670 703 C670 710.2 712.5 716 765 716 S860 710.2 860 703" fill="none" stroke="#14b8a6" stroke-width="2"/>
  <text x="765" y="726" class="node">Sandbox Evidence DB</text><text x="765" y="751" class="sub">no matching consumer</text>
  <path d="M940 703 C940 695.8 982.5 690 1035 690 S1130 695.8 1130 703 V763 C1130 770.2 1087.5 776 1035 776 S940 770.2 940 763 Z" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <path d="M940 703 C940 710.2 982.5 716 1035 716 S1130 710.2 1130 703" fill="none" stroke="#14b8a6" stroke-width="2"/>
  <text x="1035" y="726" class="node">Sandbox Alert DB</text><text x="1035" y="751" class="sub">submitted alerts</text>
  <path d="M880 449 V733 Q880 748 860 748" fill="none" stroke="#0f766e" stroke-width="2.7" marker-end="url(#teal)"/>
  <text x="850" y="667" class="edge" fill="#0f766e">no consumer</text>
  <path d="M1035 621 V690" fill="none" stroke="#0f766e" stroke-width="2.7" marker-end="url(#teal)"/>
  <text x="1080" y="660" class="edge" fill="#0f766e">alerts</text>

  <path d="M445 591 H590 Q605 591 605 576 V397 Q605 382 620 382 H850" fill="none" stroke="#dc2626" stroke-width="3.3" marker-end="url(#red)"/>
  <rect x="570" y="290" width="245" height="43" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="692" y="308" class="edge" fill="#b91c1c">TCP Hand frames</text><text x="692" y="325" class="edge" fill="#b91c1c">protected trusted network</text>
  <rect x="665" y="790" width="480" height="22" rx="11" fill="#f0f9ff"/>
  <text x="905" y="805" class="badge" fill="#475569">Agent application control is outside AcTrail and is not shown</text>
</svg>
