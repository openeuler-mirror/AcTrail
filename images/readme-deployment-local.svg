<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">AcTrail deployment in one Linux runtime boundary</title>
  <desc id="desc">Local and Docker Agent workloads generate system activity in the Host kernel. Separate AcTrail collectors observe kernel events and report to actraild. TLS-sync runtimes send plaintext directly to actraild, which persists traces for peer Web and CLI readers.</desc>
  <defs>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
    <marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0891b2"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0f766e"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.section{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}.node{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033;text-anchor:middle}.sub{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;text-anchor:middle}.edge{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}.layer{font:700 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="880" fill="#fff"/>
  <rect x="20" y="20" width="1160" height="840" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="48" y="58" class="title">Linux Host / WSL / Linux VM</text>
  <text x="48" y="93" class="layer">WORKLOADS</text>

  <rect x="55" y="110" width="510" height="195" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="78" y="142" class="section">Local Agent workload</text>
  <rect x="85" y="165" width="155" height="68" rx="14" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  <text x="162" y="205" class="node">Agent</text>
  <rect x="345" y="165" width="170" height="68" rx="14" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  <text x="430" y="192" class="node">Descendant</text><text x="430" y="214" class="sub">processes</text>
  <path d="M240 199 H345" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/>
  <text x="292" y="184" class="edge" fill="#6d28d9">spawns</text>
  <rect x="180" y="255" width="260" height="30" rx="12" fill="#ede9fe"/>
  <text x="310" y="275" class="sub">TLS-sync in observed target processes</text>

  <rect x="635" y="110" width="510" height="195" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="658" y="142" class="section">Optional Docker Agent workload</text>
  <rect x="665" y="165" width="155" height="68" rx="14" fill="#fff" stroke="#fb923c" stroke-width="2"/>
  <text x="742" y="205" class="node">Agent</text>
  <rect x="925" y="165" width="170" height="68" rx="14" fill="#fff" stroke="#fb923c" stroke-width="2"/>
  <text x="1010" y="192" class="node">Descendant</text><text x="1010" y="214" class="sub">processes</text>
  <path d="M820 199 H925" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/>
  <text x="872" y="184" class="edge" fill="#6d28d9">spawns</text>
  <rect x="760" y="255" width="260" height="30" rx="12" fill="#ffedd5"/>
  <text x="890" y="275" class="sub">TLS-sync in observed target processes</text>

  <text x="48" y="355" class="layer">ACTRAIL SERVICES</text>
  <rect x="450" y="370" width="300" height="100" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
  <text x="600" y="411" class="node">actraild</text><text x="600" y="438" class="sub">collection · analysis · governance</text>
  <path d="M810 384 C810 376.3 859.2 370 920 370 S1030 376.3 1030 384 V456 C1030 463.7 980.8 470 920 470 S810 463.7 810 456 Z" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <path d="M810 384 C810 391.7 859.2 398 920 398 S1030 391.7 1030 384" fill="none" stroke="#14b8a6" stroke-width="2"/>
  <text x="920" y="411" class="node">Trace Store</text><text x="920" y="438" class="sub">traces + semantic actions</text>
  <path d="M750 420 H810" fill="none" stroke="#0f766e" stroke-width="2.8" marker-end="url(#teal)"/>
  <text x="780" y="405" class="edge" fill="#0f766e">persist</text>

  <path d="M310 285 V380 Q310 395 325 395 H450" fill="none" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#purple)"/>
  <text x="365" y="382" class="edge" fill="#6d28d9">TLS plaintext</text>
  <path d="M890 285 V335 Q890 350 875 350 H765 Q750 350 750 370" fill="none" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#purple)"/>
  <text x="830" y="338" class="edge" fill="#6d28d9">Docker TLS plaintext</text>

  <rect x="60" y="515" width="140" height="54" rx="13" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="130" y="548" class="node">actrailctl</text>
  <path d="M200 542 H260 Q275 542 275 527 V450 Q275 435 290 435 H450" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#purple)"/>
  <text x="330" y="423" class="edge" fill="#6d28d9">control</text>

  <rect x="760" y="530" width="150" height="54" rx="13" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="835" y="563" class="node">actrailweb</text>
  <rect x="960" y="530" width="160" height="54" rx="13" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="1040" y="563" class="node">actrailviewer</text>
  <path d="M835 530 V505 Q835 490 850 490 H860 Q875 490 875 469" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="820" y="498" class="edge" fill="#1d4ed8">read</text>
  <path d="M1040 530 V505 Q1040 490 1025 490 H980 Q965 490 965 469" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="1030" y="498" class="edge" fill="#1d4ed8">read / export</text>

  <text x="48" y="630" class="layer">HOST KERNEL</text>
  <rect x="180" y="675" width="840" height="165" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
  <text x="205" y="705" class="section">Linux kernel</text>
  <rect x="465" y="690" width="270" height="65" rx="15" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="600" y="717" class="node">AcTrail kernel collectors</text><text x="600" y="739" class="sub">eBPF programs · security hooks</text>
  <rect x="240" y="780" width="720" height="42" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="806" class="node">Kernel event sources · process · file · IPC · network</text>
  <path d="M600 780 V755" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#cyan)"/>
  <text x="650" y="772" class="edge" fill="#0e7490">kernel events</text>

  <path d="M280 305 V650 Q280 665 295 665 H325 Q340 665 340 680 V780" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#slate)"/>
  <text x="220" y="752" class="edge" fill="#475569">local workload activity</text>
  <path d="M1135 305 V750 Q1135 765 1120 765 H875 Q860 765 860 780" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#slate)"/>
  <text x="980" y="752" class="edge" fill="#475569">Docker workload activity</text>
  <path d="M600 690 V470" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#cyan)"/>
  <text x="650" y="600" class="edge" fill="#0e7490">observations</text>
</svg>
