[general]
id = "actrail.sandbox-resource-alert"
api_version = "actrail.plugin.v2"
role = "sandbox-observation-consumer"
runtime = "builtin"

[host]
capabilities = []

[role.sandbox-observation-consumer.subscriptions]
observation_kinds = ["process-io", "guest-resource"]

[role.sandbox-observation-consumer.resources]
queue_capacity = 1024

[plugin_config]
format = "json"
schema_ref = "sandbox-resource-alert.config.v1.schema.json"
required = true
