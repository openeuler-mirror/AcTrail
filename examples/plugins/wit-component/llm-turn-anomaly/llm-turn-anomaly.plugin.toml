[general]
id = "actrail.llm-turn-anomaly"
api_version = "actrail.plugin.v2"
role = "observation-consumer"
runtime = "wasm"

[host]
capabilities = ["trace-activity-read", "alert-write"]

[runtime.wasm]
artifact_path = "actrail_llm_turn_anomaly_plugin.wasm"
abi = "wit-component"

[runtime.wasm.resources]
fuel_per_call = 50000000
memory_max_bytes = 67108864

[role.observation-consumer]
delivery = "trace-consistent"

[role.observation-consumer.subscriptions]
event_families = ["semantic-action", "trace-lifecycle"]

[role.observation-consumer.resources]
queue_capacity = 4096

[role.observation-consumer.post-trace]
trigger = "trace-terminal"

[hostcall_limits.plugin_config]
read_max_bytes = 16384

[hostcall_limits.trace_activity]
page_max_count = 256
total_max_count = 65536

[hostcall_limits.alert]
payload_max_bytes = 65536

[outputs.alerts.llm-high-frequency]
kind = "llm.turn.high_frequency"
title = "LLM 高频请求"
severity = "medium"
payload_schema_id = "actrail.llm-turn-anomaly.frequency.payload.v1"
payload_schema_ref = "llm-turn-anomaly.frequency.payload.v1.schema.json"

[outputs.alerts.llm-consecutive-retry]
kind = "llm.turn.consecutive_retry"
title = "LLM 连续重试"
severity = "high"
payload_schema_id = "actrail.llm-turn-anomaly.consecutive-retry.payload.v1"
payload_schema_ref = "llm-turn-anomaly.consecutive-retry.payload.v1.schema.json"

[outputs.alerts.llm-repeated-similar]
kind = "llm.turn.repeated_similar"
title = "LLM 重复相似请求"
severity = "medium"
payload_schema_id = "actrail.llm-turn-anomaly.repeated-similar.payload.v1"
payload_schema_ref = "llm-turn-anomaly.repeated-similar.payload.v1.schema.json"

[outputs.alerts.llm-error-ratio]
kind = "llm.turn.error_ratio"
title = "LLM 高错误率"
severity = "high"
payload_schema_id = "actrail.llm-turn-anomaly.error-ratio.payload.v1"
payload_schema_ref = "llm-turn-anomaly.error-ratio.payload.v1.schema.json"

[outputs.alerts.llm-context-growth]
kind = "llm.turn.context_growth"
title = "LLM 上下文快速膨胀"
severity = "medium"
payload_schema_id = "actrail.llm-turn-anomaly.context-growth.payload.v1"
payload_schema_ref = "llm-turn-anomaly.context-growth.payload.v1.schema.json"

[plugin_config]
format = "json"
schema_ref = "llm-turn-anomaly.config.v1.schema.json"
required = true
