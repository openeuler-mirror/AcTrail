[general]
id = "wasm.command-policy-dynamic"
api_version = "actrail.plugin.v2"
role = "control-decider"
runtime = "wasm"

[host]
capabilities = ["command-policy.rules.read", "command-policy.rules.match-dry-run", "command-policy.rules.validate", "command-policy.rules.apply"]

[runtime.wasm]
artifact_path = "component-command-policy-dynamic.wasm"
abi = "wit-component"

[runtime.wasm.resources]
fuel_per_call = 2000000
memory_max_bytes = 2097152

[role.control-decider.resources]
concurrency_limit = 1

[hostcall_limits.command_policy]
read_max_bytes = 65536

[hostcall_limits.plugin_config]
read_max_bytes = 65536

[hostcall_limits.plugin_command]
argv_max_count = 16
arg_max_bytes = 8192
output_max_bytes = 65536
timeout_ms = 30000

[plugin_config]
format = "json"
schema_ref = "config.schema.json"
required = true
runtime_managed = true
