<!doctype html>
<!-- 手工维护的浏览入口：由 JavaScript 读取 Markdown 并绘制布局；维护布局时只更新 Markdown。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码布局</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { max-width: 100rem; margin: 0 auto; padding: 1.5rem; line-height: 1.65; }
h1 { font-size: 1.6rem; margin: 0 0 .6rem; }
.instructions, #message { color: light-dark(#526071, #aab8c8); }
.toolbar, .legend { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.2rem; margin: 1rem 0; }
button, input { font: inherit; }
button, input[type="search"] { padding: .3rem .8rem; }
button { cursor: pointer; }
#directory { max-width: 100%; }
#search { min-width: 12rem; flex: 1; }
.tree { margin-top: 1.2rem; }
.children { margin-left: 1.4rem; border-left: 1px solid light-dark(#c5ced9, #536174); }
.node { padding: .15rem .45rem; overflow-wrap: anywhere; }
summary { cursor: pointer; }
.name { font-family: ui-monospace, monospace; font-weight: 600; }
.description { margin-left: .8rem; color: light-dark(#526071, #aab8c8); }
.status { display: inline-block; width: 1.4em; text-align: center; font-weight: 700; }
.pending { color: light-dark(#596579, #bcc6d5); }
.changing { color: light-dark(#1d4ed8, #93bbff); }
.done { color: light-dark(#16703a, #7dde9c); }
.removing { color: light-dark(#b32632, #ffa0a8); }
.module { background: light-dark(oklch(0.96 0.025 var(--hue)), oklch(0.24 0.03 var(--hue))); border-radius: .5rem; margin: .3rem 0; padding: .35rem .45rem; }
details > summary > .expanded-label { display: none; }
details[open] > summary > .collapsed-label { display: none; }
details[open] > summary > .expanded-label { display: inline; }
[hidden] { display: none !important; }
#error { color: light-dark(#b32632, #ffa0a8); }
</style>
<script src="code-layout.js" defer></script>
</head>
<body>
<main>
<h1>代码布局</h1>
<p class="instructions">选择仓库中的 <code>docs/architecture</code> 目录，读取其中的 <code>code-layout.md</code> 并展开模块。修改 Markdown 后重新选择目录即可刷新。文件在浏览器内读取。</p>
<label>布局目录 <input id="directory" type="file" webkitdirectory multiple></label>
<div class="legend" aria-label="进度图例">
<span><span class="status pending">○</span>待实现</span>
<span><span class="status changing">↻</span>修改中</span>
<span><span class="status done">✓</span>已完成</span>
<span><span class="status removing">−</span>待删除或迁移</span>
</div>
<div class="toolbar" aria-label="布局浏览控制">
<button type="button" id="expand-all" disabled>全部展开</button>
<button type="button" id="collapse-all" disabled>全部收起</button>
<input type="search" id="search" aria-label="搜索名称、路径或职责" placeholder="搜索名称、路径或职责" disabled>
</div>
<p id="message" role="status">请选择布局目录。</p>
<p id="error" role="alert" hidden></p>
<div class="tree" id="tree"></div>
<noscript>请启用 JavaScript 以读取布局文件。</noscript>
</main>
</body>
</html>
