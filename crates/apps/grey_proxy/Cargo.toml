[package]
name = "grey-proxy"
version.workspace = true
edition = "2024"
license = "MulanPSL-2.0"

[dependencies]
semantic_action = { path = "../../contracts/semantic_action" }
model_core = { path = "../../core/model" }
plugin_system = { path = "../../core/plugin_system" }
storage_core = { path = "../../storage/core" }
storage_factory = { path = "../../storage/factory" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

[[bin]]
name = "actraild-grey-proxy"
path = "src/bin/actraild-grey-proxy.rs"
