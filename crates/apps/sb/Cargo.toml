[package]
name = "sb"
version.workspace = true
edition = "2024"
license = "MulanPSL-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
sandbox_agent_runtime = { path = "../../core/sandbox_agent_runtime" }
sandbox_linux_collector = { path = "../../adapters/collectors/sandbox_linux" }
sandbox_observation = { path = "../../contracts/sandbox_observation" }
sandbox_vsock_transport = { path = "../../adapters/sandbox_link/vsock" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "actrail-sb"
path = "src/bin/actrail-sb.rs"
